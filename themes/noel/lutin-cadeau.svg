<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 96">
  <!-- Lutin qui marche vers la droite en portant un cadeau (thème Noël) -->
  <style>
    .leg { transform-box: fill-box; transform-origin: 50% 0; }
    .l1 { animation: step .36s ease-in-out infinite alternate; }
    .l2 { animation: step .36s ease-in-out infinite alternate-reverse; }
    @keyframes step { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
    .body { animation: hop .18s ease-in-out infinite alternate; }
    @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    .bell { transform-box: fill-box; transform-origin: 50% 0; animation: ring .36s ease-in-out infinite alternate; }
    @keyframes ring { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
  </style>
  <defs>
    <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="3" fill="#fff"/><rect y="3" width="6" height="3" fill="#d42a35"/></pattern>
  </defs>
  <ellipse cx="34" cy="93" rx="16" ry="2.5" fill="#000" opacity=".18"/>
  <!-- jambes rayées et bottes pointues -->
  <g class="leg l2"><rect x="27" y="66" width="6" height="18" rx="2" fill="url(#stripes)"/><path d="M25 82h10c4 0 8-1 10-5 1 4-1 9-6 10H25z" fill="#155e36"/></g>
  <g class="leg l1"><rect x="35" y="66" width="6" height="18" rx="2" fill="url(#stripes)"/><path d="M33 82h10c4 0 8-1 10-5 1 4-1 9-6 10H33z" fill="#1b7a45"/></g>
  <g class="body">
    <!-- tunique à pointes -->
    <path d="M22 46h26l4 22-5-3-4 4-4-4-4 4-4-4-4 4-4-4-5 3z" fill="#1f9d55"/>
    <rect x="22" y="58" width="28" height="5" fill="#22181a"/>
    <rect x="32" y="57" width="7" height="7" rx="1" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
    <path d="M26 46l9 7 9-7" stroke="#d42a35" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <!-- cadeau tenu devant -->
    <rect x="38" y="42" width="22" height="19" rx="2.5" fill="#d42a35"/>
    <path d="M49 42v19M38 51.5h22" stroke="#f2c14e" stroke-width="3.5"/>
    <path d="M49 42c-5-7-11-4-8 0zM49 42c5-7 11-4 8 0z" fill="#f2c14e"/>
    <circle cx="40" cy="52" r="3.6" fill="#f6c9a6"/>
    <circle cx="58" cy="52" r="3.6" fill="#f6c9a6"/>
    <!-- tête -->
    <path d="M24 32l-7-6 9 2z" fill="#f2b896"/>
    <path d="M44 32l8-6-9 2z" fill="#f2b896"/>
    <circle cx="34" cy="34" r="11" fill="#f6c9a6"/>
    <circle cx="38" cy="33" r="1.6" fill="#2a1a14"/>
    <circle cx="30" cy="33" r="1.6" fill="#2a1a14"/>
    <circle cx="41" cy="37" r="2.4" fill="#f4a7a0" opacity=".8"/>
    <circle cx="27" cy="37" r="2.4" fill="#f4a7a0" opacity=".8"/>
    <path d="M31 39c2 2 5 2 7 0" stroke="#a24a3a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- bonnet qui retombe en arrière -->
    <path d="M22 28c0-14 10-20 22-14 4 2 6 7 6 14z" fill="#1f9d55"/>
    <path d="M26 16C18 8 8 8 4 16" stroke="#1f9d55" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="21" y="25" width="30" height="6" rx="3" fill="#fff"/>
    <g class="bell"><path d="M4 18v1" stroke="#b8862a" stroke-width="1"/><circle cx="4" cy="22" r="3.6" fill="#f2c14e" stroke="#b8862a" stroke-width="1"/></g>
  </g>
</svg>
