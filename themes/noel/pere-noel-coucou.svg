<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 120">
  <!-- Père Noël qui sort du bas de l'écran et fait coucou (thème Noël) -->
  <style>
    .hand { transform-box: fill-box; transform-origin: 50% 100%; animation: wave .35s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    .pom { transform-box: fill-box; transform-origin: 100% 0; animation: flop .7s ease-in-out infinite alternate; }
    @keyframes flop { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
    .eyes { animation: blink 3.2s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  </style>
  <!-- bras qui salue -->
  <g class="hand">
    <path d="M100 112 108 64" stroke="#d42a35" stroke-width="15" stroke-linecap="round"/>
    <rect x="98" y="66" width="20" height="8" rx="4" fill="#fff" transform="rotate(10 108 70)"/>
    <path d="M100 58c0-10 4-14 9-14s9 4 8 13c-1 6-4 9-9 9s-8-3-8-8z" fill="#22181a"/>
    <path d="M115 52c4-2 7 0 6 4-1 3-4 4-6 3z" fill="#22181a"/>
  </g>
  <!-- buste -->
  <path d="M14 120c0-26 20-40 46-40s46 14 46 40z" fill="#d42a35"/>
  <path d="M60 82v38" stroke="#fff" stroke-width="10"/>
  <circle cx="60" cy="98" r="2.6" fill="#22181a"/><circle cx="60" cy="112" r="2.6" fill="#22181a"/>
  <!-- tête -->
  <circle cx="60" cy="54" r="22" fill="#f6c9a6"/>
  <path d="M34 56c-2 28 12 40 26 40s28-12 26-40c-6 8-16 10-26 10s-20-2-26-10z" fill="#fff"/>
  <path d="M46 70c4-5 10-5 14 0 4-5 10-5 14 0" stroke="#ececec" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M52 76c4 3 12 3 16 0" stroke="#a24a3a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="63" r="5" fill="#f39c8e"/>
  <g class="eyes"><circle cx="52" cy="54" r="2.6" fill="#2a1a14"/><circle cx="68" cy="54" r="2.6" fill="#2a1a14"/></g>
  <path d="M46 47c3-3 7-3 10-1M64 46c3-2 7-2 10 1" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="45" cy="62" r="4" fill="#f4a7a0" opacity=".7"/>
  <circle cx="75" cy="62" r="4" fill="#f4a7a0" opacity=".7"/>
  <!-- bonnet -->
  <path d="M36 42c0-24 24-34 44-20 6 4 6 12 6 20z" fill="#d42a35"/>
  <g class="pom">
    <path d="M44 26C34 16 20 16 12 28" stroke="#d42a35" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="32" r="8" fill="#fff"/>
  </g>
  <rect x="32" y="38" width="56" height="11" rx="5.5" fill="#fff"/>
</svg>
