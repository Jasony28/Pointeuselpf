<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
  <!-- Trois boules de Noël qui pendent sous la barre du haut et se balancent (thème Noël) -->
  <style>
    .s { transform-box: view-box; animation: swing 2.6s ease-in-out infinite alternate; }
    .a { transform-origin: 20px 0; }
    .b { transform-origin: 60px 0; animation-duration: 3.1s; animation-delay: -.8s; }
    .c { transform-origin: 100px 0; animation-duration: 2.2s; animation-delay: -1.4s; }
    @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    .shine { animation: shine 2s ease-in-out infinite alternate; }
    @keyframes shine { from { opacity: .35; } to { opacity: .9; } }
  </style>
  <g class="s a">
    <path d="M20 0v48" stroke="#c9b27a" stroke-width="1.2"/>
    <rect x="16" y="46" width="8" height="6" rx="1.5" fill="#d9b44a"/>
    <circle cx="20" cy="64" r="13" fill="#d42a35"/>
    <path d="M8 62c8 4 16 4 24 0" stroke="#f2c14e" stroke-width="2" fill="none"/>
    <path d="M9 68c7 3 15 3 22 0" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="2 3" fill="none"/>
    <ellipse class="shine" cx="15" cy="58" rx="3.5" ry="5" fill="#fff" transform="rotate(30 15 58)"/>
  </g>
  <g class="s b">
    <path d="M60 0v70" stroke="#c9b27a" stroke-width="1.2"/>
    <rect x="56" y="68" width="8" height="6" rx="1.5" fill="#d9b44a"/>
    <circle cx="60" cy="87" r="14" fill="#f2c14e"/>
    <path d="M60 76l2.4 5 5.6.6-4.2 3.8 1.2 5.4L60 88l-5 2.8 1.2-5.4-4.2-3.8 5.6-.6z" fill="#d42a35"/>
    <ellipse class="shine" cx="54" cy="80" rx="3.5" ry="5" fill="#fff" transform="rotate(30 54 80)"/>
  </g>
  <g class="s c">
    <path d="M100 0v34" stroke="#c9b27a" stroke-width="1.2"/>
    <rect x="96" y="32" width="8" height="6" rx="1.5" fill="#d9b44a"/>
    <circle cx="100" cy="49" r="12" fill="#1f9d55"/>
    <path d="M89 46h22M89 52h22" stroke="#fff" stroke-width="2.4" opacity=".85"/>
    <ellipse class="shine" cx="95" cy="44" rx="3" ry="4.5" fill="#fff" transform="rotate(30 95 44)"/>
  </g>
</svg>
